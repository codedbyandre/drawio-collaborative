# Laptop path. Does not bind 80 or 443.
#   docker compose -f docker-compose.local.yml up -d --build
# Editor: http://localhost:8080
# Example parent: http://localhost:3000

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DRAWIO_PUBLIC_HOST: ${DRAWIO_PUBLIC_HOST:?Set DRAWIO_PUBLIC_HOST in .env}
      DRAWIO_FRAME_ANCESTORS: ${DRAWIO_FRAME_ANCESTORS:?Set DRAWIO_FRAME_ANCESTORS in .env}
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      realtime:
        condition: service_healthy
      drawio:
        condition: service_started

  drawio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DRAWIO_SELF_CONTAINED: "1"
      DRAWIO_SCHEME: http
      DRAWIO_PUBLIC_HOST: ${DRAWIO_PUBLIC_HOST:?Set DRAWIO_PUBLIC_HOST in .env}
      DRAWIO_BASE_URL: http://${DRAWIO_PUBLIC_HOST}
      DRAWIO_SERVER_URL: http://${DRAWIO_PUBLIC_HOST}/
      DRAWIO_VIEWER_URL: http://${DRAWIO_PUBLIC_HOST}
      DRAWIO_LIGHTBOX_URL: http://${DRAWIO_PUBLIC_HOST}
      DRAWIO_LANG: ${DRAWIO_LANG:-en}
      DRAWIO_CONFIG: '{"lockdown":false,"enableAi":false}'
    volumes:
      - ${DRAWIO_LIBS_DIR:-./libs}:/config/libs:ro

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      DRAWIO_ORIGIN: ${DRAWIO_ORIGIN:?Set DRAWIO_ORIGIN in .env}
      DRAWIO_RT_SECRET: ${DRAWIO_RT_SECRET:?Set DRAWIO_RT_SECRET in .env}
      DRAWIO_RT_MAX_CLIENTS: ${DRAWIO_RT_MAX_CLIENTS:-32}
    expose:
      - "8080"

volumes:
  caddy_local_data:
  caddy_local_config:
